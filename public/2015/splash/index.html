<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Day for Night</title>
  <meta name="description" content="Day for Night — Light &amp; Sound Collide. A Houston festival of music, art, and technology.">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="/2015/splash/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/2015/splash/css/app.css">
  <link rel="stylesheet" href="/2015/splash/css/font-awesome.min.css">
</head>
<body>
  <section class="br-home-wrap">
    <div class="row">
      <div class="br-caption text-center">
        <i class="logo"><img src="/2015/splash/svg/logo-opt.svg" alt="Day for Night"></i>
        <p>LIGHT &amp; SOUND COLLIDE</p>
        <ul class="br-media">
          <li><a href="#" aria-label="Facebook"><i class="fa fa-facebook"></i></a></li>
          <li><a href="#" aria-label="Instagram"><i class="fa fa-instagram"></i></a></li>
          <li><a href="#" aria-label="Twitter"><i class="fa fa-twitter"></i></a></li>
        </ul>
      </div>
    </div>
  </section>
  <script src="/2015/splash/js/jquery.min.js"></script>
  <script src="/2015/splash/js/foundation.min.js"></script>
  <script src="/2015/splash/js/modernizr.js"></script>
  <script src="/2015/splash/js/app.js"></script>

  <!-- Year-navigation pill (matches the Astro <YearRotationPill> used on every
       built page; hand-authored here because the splash is a static file). -->
  <aside class="dfn-year-pill" aria-label="Day For Night snapshot navigation">
    <span class="dfn-year-pill__home">DFN</span>
    <a class="dfn-year-pill__nav dfn-year-pill__nav--next" href="/2015/" title="2015 — Day For Night 2015 (Main)">DFN 2015 &rarr;</a>
  </aside>
  <style>
    .dfn-year-pill {
      position: fixed;
      bottom: 14px;
      right: 14px;
      z-index: 9999;
      display: inline-flex;
      align-items: stretch;
      background: rgba(20, 20, 20, 0.85);
      color: #fff;
      border-radius: 999px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    }
    .dfn-year-pill a,
    .dfn-year-pill__home {
      color: #fff !important;
      text-decoration: none;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }
    .dfn-year-pill__nav { opacity: 0.7; }
    .dfn-year-pill__nav:hover { background: rgba(255, 255, 255, 0.12); opacity: 1; }
    .dfn-year-pill__home {
      font-weight: 600;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px 0 0 999px;
      cursor: default;
    }
    .dfn-year-pill__nav--next { border-radius: 0 999px 999px 0; }
    @media print { .dfn-year-pill { display: none; } }
  </style>
</body>
</html>
