<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Day for Night</title>
  <meta name="description" content="Day for Night — Light &amp; Sound Collide. A Houston festival of music, art, and technology.">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="/2015/splash/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/2015/splash/css/app.css">
  <link rel="stylesheet" href="/2015/splash/css/font-awesome.min.css">
  <style>
    .work-order-origin {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 22px;
      z-index: 20;
      text-align: center;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .work-order-origin a {
      display: inline-flex;
      align-items: center;
      gap: 0.65em;
      padding: 8px 13px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      color: rgba(255, 255, 255, 0.78);
      text-decoration: none;
      background: rgba(0, 0, 0, 0.34);
    }

    .work-order-origin a:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.72);
    }

    .work-order-origin strong {
      font-weight: 700;
    }
  </style>
</head>
<body>
  <section class="br-home-wrap">
    <div class="row">
      <div class="br-caption text-center">
        <i class="logo"><img src="/2015/splash/svg/logo-opt.svg" alt="Day for Night"></i>
        <p>LIGHT &amp; SOUND COLLIDE</p>
        <ul class="br-media">
          <li><a href="#" aria-label="Facebook"><i class="fa fa-facebook"></i></a></li>
          <li><a href="#" aria-label="Instagram"><i class="fa fa-instagram"></i></a></li>
          <li><a href="#" aria-label="Twitter"><i class="fa fa-twitter"></i></a></li>
        </ul>
      </div>
    </div>
  </section>
  <aside class="work-order-origin" aria-label="Day for Night origin attribution">
    <a href="https://work-order.co" target="_blank" rel="noopener noreferrer">
      <span>Co-founded &amp; shaped with</span>
      <strong>Work-Order</strong>
      <span aria-hidden="true">↗</span>
    </a>
  </aside>
  <script src="/2015/splash/js/jquery.min.js"></script>
  <script src="/2015/splash/js/foundation.min.js"></script>
  <script src="/2015/splash/js/modernizr.js"></script>
  <script src="/2015/splash/js/app.js"></script>
</body>
</html>
