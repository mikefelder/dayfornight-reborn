<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <title>Day for Night</title>
  <meta name="description" content="Day for Night — Light &amp; Sound Collide. A Houston festival of music, art, and technology.">
  <meta name="robots" content="index, follow">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/font-awesome.min.css">
</head>
<body>
  <section class="br-home-wrap">
    <div class="row">
      <div class="br-caption text-center">
        <i class="logo"><img src="svg/logo-opt.svg" alt="Day for Night"></i>
        <p>LIGHT &amp; SOUND COLLIDE</p>
        <ul class="br-media">
          <li><a href="#" aria-label="Facebook"><i class="fa fa-facebook"></i></a></li>
          <li><a href="#" aria-label="Instagram"><i class="fa fa-instagram"></i></a></li>
          <li><a href="#" aria-label="Twitter"><i class="fa fa-twitter"></i></a></li>
        </ul>
      </div>
    </div>
  </section>
  <footer>
    <div class="row">
      <div class="large-12 text-center columns">
        <h4 class="GT-Cinetype-Regular text-center">Sign up for our newsletter</h4>
        <form class="newsletter-signup" action="#" method="post">
          <label>
            <span>Email</span>
            <input type="email" name="email" placeholder="you@example.com" autocomplete="email" disabled>
          </label>
          <input type="submit" value="Subscribe" disabled>
        </form>
      </div>
    </div>
  </footer>
  <script src="js/jquery.min.js"></script>
  <script src="js/foundation.min.js"></script>
  <script src="js/modernizr.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
